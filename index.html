<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ajay Gupta Portfolio</title>
    <style>
      :root {
        --bg-dark: #0f172a;
        --bg-card: #111827;
        --primary: #60a5fa;
        --accent: #34d399;
        --text: #e5e7eb;
        --muted: #cbd5e1;
        --shadow: rgba(15, 23, 42, 0.4);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg-dark), #1e293b);
        color: var(--text);
      }

      .card {
        width: min(90vw, 700px);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(96, 165, 250, 0.35);
        border-radius: 18px;
        box-shadow: 0 20px 45px var(--shadow);
        padding: 48px 32px;
        text-align: center;
      }

      .tag {
        display: inline-block;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(52, 211, 153, 0.12);
        border: 1px solid rgba(52, 211, 153, 0.4);
        color: var(--accent);
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 5vw, 4rem);
        line-height: 1.1;
      }

      .highlight {
        color: var(--primary);
      }

      p {
        margin: 18px auto 0;
        max-width: 540px;
        color: var(--muted);
        font-size: 1.1rem;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Welcome to <span class="highlight">Dikshant's</span> Portfolio</h1>
      <p>
       Your lighting planner
      </p>
    </main>
  </body>
</html>
